<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>DOSE · Pontos do Rio (protótipo)</title>
<link rel="stylesheet" href="../fonts/fontes.css">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
/* Protótipo para o DOSE Studio: mapa do Rio inclinado, prédios em grafite, sem brilho; laranja só nos pontos. */
:root{--bg:#0F1012;--s1:#17181B;--s2:#1E2024;--s3:#262930;--line:#272A2F;--tx:#F2F1EC;--tx2:#A3A5A8;--tx3:#73767B;--bone:#D8D2C2;--ember:#E4572E;--expo:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Archivo,system-ui,sans-serif;overflow:hidden}
#mapa{position:absolute;inset:0}
.topo{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 16px) 18px 40px;background:linear-gradient(var(--bg) 55%,transparent);pointer-events:none;z-index:2}
.topo .eb{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);font-weight:700}
.topo h1{margin:4px 0 0;font-weight:900;font-size:30px;letter-spacing:-.05em;text-transform:uppercase;line-height:.95}
.topo h1 i{font-style:normal;color:var(--ember)}
.pt{width:14px;height:14px;border-radius:50%;background:var(--ember);border:2px solid var(--bg);cursor:pointer;opacity:0;transform:translateY(-18px);transition:opacity .4s ease,transform .6s var(--expo)}
.pt.on{opacity:1;transform:none}
.pt.on::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--ember);animation:onda 1.4s var(--expo) 1 forwards}
@keyframes onda{from{transform:scale(1);opacity:.9}to{transform:scale(3.2);opacity:0}}
.lista{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:14px 0 calc(env(safe-area-inset-bottom) + 16px);background:linear-gradient(transparent,var(--bg) 30%)}
.trilho{display:flex;gap:10px;overflow-x:auto;padding:0 18px;scroll-snap-type:x mandatory;scrollbar-width:none}.trilho::-webkit-scrollbar{display:none}
.cartao{flex:0 0 78%;scroll-snap-align:start;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;transition:border-color .2s}
.cartao.ativo{border-color:var(--ember)}
.cartao b{display:block;font-size:17px;letter-spacing:-.02em}
.cartao .m{font-family:'Archivo Narrow',sans-serif;font-weight:700;color:var(--tx2);font-size:14px;margin-top:2px}
.cartao p{margin:8px 0 0;font-size:13px;color:var(--tx2);line-height:1.4}
.cartao .h{display:inline-block;margin-top:10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--tx)}
.aviso{position:absolute;top:50%;left:18px;right:18px;transform:translateY(-50%);text-align:center;color:var(--tx2);font-size:14px;z-index:1}
.maplibregl-ctrl-attrib{background:rgba(15,16,18,.6)!important;color:var(--tx3)!important;font-size:10px}.maplibregl-ctrl-attrib a{color:var(--tx2)!important}
@media (prefers-reduced-motion:reduce){.pt{opacity:1;transform:none;transition:none}.pt.on::after{animation:none;display:none}}
</style></head><body>
<div id="mapa"></div><div class="aviso" id="aviso">Carregando o mapa…</div>
<div class="topo"><div class="eb">Comunidade DOSE · Rio</div><h1>Pontos de<br>treino<i>.</i></h1></div>
<div class="lista"><div class="trilho" id="trilho"></div></div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// Percursos conferidos no Time Out Rio (2026). Coordenadas do OpenStreetMap (Nominatim), consultadas em 09/11/2026: MAM, Parque dos Patins, Praia do Leme, Paineiras, Vista Chinesa, Quinta da Boa Vista e Praia de Grumari.
const PONTOS=[
 {id:'aterro',nome:'Aterro do Flamengo',m:'7,6 km · plano · sombra',d:'Do MAM ao Monumento Estácio de Sá, com vista do Pão de Açúcar.',c:[-43.17283,-22.91400],h:'Ter e qui · 6h30'},
 {id:'lagoa',nome:'Lagoa Rodrigo de Freitas',m:'quase 8 km · plano',d:'Volta completa. Tem gente correndo a qualquer hora.',c:[-43.21664,-22.97124],h:'Seg, qua e sex · 6h'},
 {id:'orla',nome:'Orla do Leme ao Leblon',m:'9 km · beira-mar',d:'Brisa do mar e parada para um mergulho no fim.',c:[-43.16986,-22.96445],h:'Sáb · 7h'},
 {id:'paineiras',nome:'Paineiras',m:'8 km · subida',d:'Dentro do Parque Nacional da Tijuca, mistura subida e trecho leve.',c:[-43.21743,-22.94660],h:'Dom · 7h'},
 {id:'chinesa',nome:'Vista Chinesa',m:'subida forte',d:'Subida pela floresta até o mirante.',c:[-43.24947,-22.97326],h:'Dom · 6h30'},
 {id:'quinta',nome:'Quinta da Boa Vista',m:'cerca de 3,5 km · terra e grama',d:'Lagos e palmeiras. Bom para quem está começando.',c:[-43.22631,-22.90547],h:'Sáb · 8h'},
 {id:'grumari',nome:'Grumari ao Pontal',m:'8 km · beira-mar',d:'Longão de fim de semana com mar no fim.',c:[-43.53419,-23.05015],h:'Dom · 6h'}
];
const reduz=matchMedia('(prefers-reduced-motion: reduce)').matches;
const tri=document.getElementById('trilho');
tri.innerHTML=PONTOS.map((p,i)=>`<div class="cartao" data-i="${i}"><b>${p.nome}</b><div class="m">${p.m}</div><p>${p.d}</p><span class="h">${p.h} · horário de exemplo</span></div>`).join('');
// cores DOSE no estilo do OpenFreeMap
function pintar(map){ const st=map.getStyle(); st.layers.forEach(l=>{ const id=l.id, t=l.type; try{
  if(t==='background') map.setPaintProperty(id,'background-color','#0F1012');
  else if(t==='fill'&&/water/.test(id)) map.setPaintProperty(id,'fill-color','#17181B');
  else if(t==='fill'&&/park|wood|grass|landcover|landuse/.test(id)) map.setPaintProperty(id,'fill-color','#14161A');
  else if(t==='fill') map.setPaintProperty(id,'fill-color','#121316');
  else if(t==='line'&&/water|river/.test(id)) map.setPaintProperty(id,'line-color','#17181B');
  else if(t==='line'&&/boundary|admin/.test(id)) map.setLayoutProperty(id,'visibility','none');
  else if(t==='line') map.setPaintProperty(id,'line-color','#272A2F');
  else if(t==='symbol'){ if(/poi|housenum|transit|aeroway|shield|highway-name|road_shield/.test(id)||(l.layout&&l.layout['icon-image'])) map.setLayoutProperty(id,'visibility','none'); else { map.setPaintProperty(id,'text-color','#73767B'); map.setPaintProperty(id,'text-halo-color','#0F1012'); if(l.layout&&l.layout['text-field']) map.setLayoutProperty(id,'text-field',['coalesce',['get','name:pt'],['get','name']]); } }
  else if(t==='fill-extrusion') map.removeLayer(id);
 }catch(e){} });
 const src=Object.keys(st.sources).find(k=>st.sources[k].type==='vector');
 if(src) map.addLayer({id:'predios-dose',type:'fill-extrusion',source:src,'source-layer':'building',minzoom:13,
   paint:{'fill-extrusion-color':'#1E2024','fill-extrusion-height':['coalesce',['get','render_height'],8],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.92}});
}
let map; try{
map=new maplibregl.Map({container:'mapa',style:'https://tiles.openfreemap.org/styles/positron',center:[-43.30,-22.97],zoom:10,pitch:0,bearing:0,attributionControl:{compact:true}});
map.on('load',()=>{ document.getElementById('aviso').remove(); pintar(map);
  const mk=PONTOS.map((p,i)=>{ const el=document.createElement('div'); el.className='pt'; el.title=p.nome; el.onclick=()=>ir(i); new maplibregl.Marker({element:el}).setLngLat(p.c).addTo(map); return el; });
  const cair=()=>mk.forEach((el,i)=>setTimeout(()=>el.classList.add('on'),reduz?0:250+i*140));
  if(reduz){ map.jumpTo({center:[-43.215,-22.955],zoom:11.7,pitch:50,bearing:-18}); cair(); }
  else { map.flyTo({center:[-43.215,-22.955],zoom:11.7,pitch:55,bearing:-18,duration:2600,essential:true}); map.once('moveend',cair); }
});
}catch(e){ document.getElementById('aviso').textContent='Este aparelho não conseguiu abrir o mapa.'; }
function ir(i){ const p=PONTOS[i]; document.querySelectorAll('.cartao').forEach(c=>c.classList.toggle('ativo',+c.dataset.i===i));
  document.querySelector(`.cartao[data-i="${i}"]`).scrollIntoView({behavior:reduz?'auto':'smooth',inline:'start',block:'nearest'});
  if(map) map.flyTo({center:p.c,zoom:14.6,pitch:60,bearing:-30,duration:reduz?0:1800,essential:true}); }
tri.addEventListener('click',e=>{ const c=e.target.closest('.cartao'); if(c) ir(+c.dataset.i); });
</script>
</body></html>
