<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>DOSE · Sistema de design</title>
<link rel="stylesheet" href="../fonts/fontes.css">
<style>
:root{--graphite:#0F1012;--surface:#17181B;--line:#272A2F;--ink:#F2F1EC;--muted:#A3A5A8;--ember:#E4572E;--nav:56px}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--graphite);color:var(--ink);font-family:Archivo,system-ui,sans-serif}
.ds-nav{position:fixed;inset:0 0 auto 0;height:var(--nav);display:flex;align-items:center;gap:18px;padding:0 16px;background:var(--graphite);border-bottom:1px solid var(--line);z-index:2}
.ds-mark{white-space:nowrap;font-weight:900;font-size:20px;letter-spacing:-.06em;text-transform:uppercase}
.ds-mark i{font-style:normal;color:var(--ember)}
.ds-mark small{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:11px;letter-spacing:.14em;color:var(--muted);margin-left:8px}
.ds-tabs{display:flex;gap:4px;margin-left:auto}
.ds-tabs a{font-size:14px;font-weight:700;color:var(--muted);text-decoration:none;padding:10px 14px;border-radius:12px;min-height:44px;display:inline-flex;align-items:center}
.ds-tabs a[aria-current="page"]{color:var(--ink);background:var(--surface)}
.ds-tabs a[aria-disabled="true"]{opacity:.45;pointer-events:none}
.ds-view{position:fixed;inset:var(--nav) 0 0 0}
.ds-view iframe{width:100%;height:100%;border:0;display:block;background:var(--graphite)}
#components{display:none}
@media (max-width:480px){.ds-mark small{display:none}.ds-tabs a{padding:10px 10px}}
</style>
</head>
<body>
<nav class="ds-nav" aria-label="Design system">
  <span class="ds-mark">DOSE<i>.</i><small>SISTEMA DE DESIGN</small></span>
  <div class="ds-tabs">
    <a href="#overview" id="tOverview" aria-current="page">Visão geral</a>
    <a href="#components" id="tComponents">Componentes</a>
  </div>
</nav>
<main class="ds-view" id="overview"><iframe src="overview.html" title="DOSE · Visão geral (dados de demonstração)"></iframe></main>
<main class="ds-view" id="components"><iframe src="components.html" title="DOSE · Componentes" loading="lazy"></iframe></main>
<script>
(function(){
  function show(){ var h=location.hash==='#components'&&document.getElementById('tComponents').getAttribute('aria-disabled')!=='true'?'components':'overview';
    document.getElementById('overview').style.display=h==='overview'?'block':'none';
    document.getElementById('components').style.display=h==='components'?'block':'none';
    [['tOverview','overview'],['tComponents','components']].forEach(function(p){ var el=document.getElementById(p[0]); if(h===p[1]) el.setAttribute('aria-current','page'); else el.removeAttribute('aria-current'); }); }
  window.addEventListener('hashchange',show); show();
})();
</script>
</body>
</html>
